# `pnpm check` is the local equivalent. CI runs the same commands as independent
# jobs so one long gate cannot serialize the rest; `check` aggregates them and is
# the only required status on main. `branch-policy` and `plan` have no `pnpm check`
# equivalent: one reads the branch name, the other the issue a pull request closes.
name: check

on:
  pull_request:
    # `edited` reruns the plan job when the body gains or loses its link.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    # Build the payloads once; every test and registry job downloads this artifact.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm registry:build
      - uses: actions/upload-artifact@v4
        with:
          name: registry-payloads
          # The three paths share `public` as their least common ancestor, so the
          # artifact contains `r/...` and the two llms files. Download into
          # `public` to restore the checkout layout.
          path: |
            public/r
            public/llms.txt
            public/llms-full.txt
          retention-days: 1
          if-no-files-found: error

  static:
    # typecheck, lint and parity do not need the payload build, so they start
    # immediately and run beside `prepare`.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        command: [typecheck, lint, parity:check]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.command }}

  branch-policy:
    # `main` is merge-only: a pull request must come from a named work branch, and a
    # `push` run here is the merge commit of an approved pull request, so it passes.
    # No install: the guard is plain Node.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/branch-policy.mjs --ci

  plan:
    # The pull request must name the task it closes and that task must be ready: the
    # `task` label, status:claimed or status:in-review, and no open `Blocked by`
    # reference. It reads the event payload and the REST API, never the diff, so a
    # docs-only pull request is judged by the same rules and a fork's read-only token
    # is enough to check it.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/plan/check.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  registry-check:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: registry-payloads
          path: public
      - run: pnpm registry:check
      # Distribution: every payload agrees with `registry.json`, and every install plan resolves only
      # the relative, namespaced and package dependencies that plan declares.
      - run: pnpm install:check

  runtime:
    needs: prepare
    runs-on: ubuntu-latest
    # Hang guard, not a performance budget (ADR-023): the suite prints its result and
    # can linger on vitest workers afterwards, so the ceiling only has to outlast that
    # teardown and it tracks the growing catalogue rather than a measured cost.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: registry-payloads
          path: public
      - run: pnpm test:local

  gate:
    # One job per cli-gate file. They are subprocess-heavy but independent, and
    # the slowest file no longer waits behind doc-template or motion-docs.
    needs: prepare
    runs-on: ubuntu-latest
    # Hang guard, not a performance budget (ADR-023). Each case spawns the whole
    # registry check, so the ceiling tracks how many components are migrated and how
    # large each installation closure is; doc-template grew past 20 minutes as the
    # catalogue reached 63 items even with no regression in per-run cost.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        file:
          - tests/lib/doc-template.test.tsx
          - tests/lib/motion-docs.test.tsx
          - tests/lib/motion-v2-reporter.test.tsx
          - tests/lib/motion-contract.test.tsx
          - tests/lib/motion-v2-projection.test.tsx
          - tests/lib/motion-targets.test.tsx
          - tests/lib/joint-motion-reporter.test.tsx
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: registry-payloads
          path: public
      - run: pnpm test:gate ${{ matrix.file }}

  browser:
    # Evidence, not a gate. It builds the site and replays the specs of the components
    # this pull request touches, so a reviewer downloads full/reduced/none screenshots
    # instead of trusting a description of screenshots that live in an ignored
    # `.cache/`. It is deliberately absent from `check`'s needs: a flaky engine run
    # must not block a docs change, and `check` stays the only required status.
    #
    # The scope is computed before anything is installed, so a diff that names no
    # component with a spec skips the install, the browser download and the build
    # instead of paying for them and then skipping the test.
    if: github.event_name == 'pull_request'
    needs: prepare
    runs-on: ubuntu-latest
    # `pnpm build` alone approaches half of this, and the browser download and the
    # suite have to fit beside it. The long ceiling is a hang guard, not a budget.
    timeout-minutes: 25
    env:
      # `playwright.config.ts` only keeps a screenshot per test when asked; the
      # artifact is the reason this run exists, so the run asks.
      PLAYWRIGHT_SCREENSHOT: "on"
    steps:
      - uses: actions/checkout@v4
        with:
          # The scope is `origin/<base>...HEAD`, which needs the merge base: the
          # default depth-1 checkout has neither the base ref nor the commit to
          # diff it against.
          fetch-depth: 0
      - name: Select the affected specs
        id: specs
        run: |
          set -euo pipefail
          specs="$RUNNER_TEMP/browser-specs.txt"
          node scripts/ci/affected-e2e-specs.mjs --base "origin/${{ github.base_ref }}" > "$specs"
          list="$(tr '\n' ' ' < "$specs" | sed 's/ *$//')"
          echo "list=$list" >> "$GITHUB_OUTPUT"
          if [ -z "$list" ]; then
            echo "count=0" >> "$GITHUB_OUTPUT"
          else
            echo "count=$(wc -w <<< "$list" | tr -d ' ')" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.specs.outputs.count != '0'
      - uses: actions/setup-node@v4
        if: steps.specs.outputs.count != '0'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/download-artifact@v4
        if: steps.specs.outputs.count != '0'
        with:
          name: registry-payloads
          path: public
      - if: steps.specs.outputs.count != '0'
        run: pnpm install --frozen-lockfile
      - if: steps.specs.outputs.count != '0'
        run: pnpm exec playwright install --with-deps chromium
      # One build for this job. `playwright.config.ts` serves it with `next start`;
      # the browser is not started again per spec file.
      - if: steps.specs.outputs.count != '0'
        run: pnpm build
      - name: Run the affected specs
        if: steps.specs.outputs.count != '0'
        run: pnpm exec playwright test ${{ steps.specs.outputs.list }}
      - uses: actions/upload-artifact@v4
        # On failure too: a red run is exactly when someone opens the evidence.
        if: always() && steps.specs.outputs.count != '0'
        with:
          name: browser-evidence
          # `test-results` holds the screenshots (`PLAYWRIGHT_SCREENSHOT=on`) and any
          # retry trace, `playwright-report` links them, and `.cache` holds the proof
          # sheets the batch specs write under names reviewers already know.
          path: |
            playwright-report
            test-results
            .cache
          retention-days: 7
          if-no-files-found: ignore

  check:
    # The required status. It fails when any fan-out job failed, was cancelled or
    # was skipped; individual job names are diagnostics, not merge requirements.
    if: always()
    needs: [prepare, static, branch-policy, plan, registry-check, runtime, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every gate job
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
